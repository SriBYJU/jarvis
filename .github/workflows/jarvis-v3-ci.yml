name: JARVIS Final CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Syntax check local services
        run: |
          node --check companion/server.js
          node --check companion/realtime-final-server.js
          node --check companion/mcp-server.js
          node --check companion/spotify-server.js
          node --check companion/browser-server.js
          node --check companion/agents.js
          node --check companion/policy.js
          node --check companion/launcher.js
          node --check lib/store.js
          node --check pages/api/tools/generate-file.js

      - name: Architecture regression guards
        shell: bash
        run: |
          grep -q "<Component" pages/_app.js
          grep -q "JarvisRuntimeFinal" pages/_app.js
          grep -q "FastMapRuntime" pages/_app.js
          ! grep -q "JarvisRuntimeV6" pages/_app.js
          ! grep -q "JarvisShellV5" pages/_app.js
          grep -q "realtime-final-server" companion/launcher.js
          ! grep -q "realtime-v5-server" companion/launcher.js
          ! grep -q "realtime-v6-server" companion/launcher.js
          ! grep -A12 'app.get("/health"' companion/browser-server.js | grep -q 'ensureContext'
          grep -q "think: false" companion/realtime-final-server.js
          grep -q "keep_alive" companion/realtime-final-server.js
          grep -q "app.post('/v1/agent'" companion/realtime-final-server.js
          ! grep -q '"xlsx"' package.json
          ! grep -q '"pptxgenjs"' package.json
          ! grep -q '"@vercel/kv"' package.json

      - name: Strict web dependency install
        run: npm ci

      - name: Web dependency security gate
        run: npm audit --audit-level=high

      - name: Build full Jarvis HUD
        run: npm run build

      - name: Smoke-test restored web features
        shell: bash
        env:
          JARVIS_DATA_DIR: /tmp/jarvis-web-store
        run: |
          rm -rf "$JARVIS_DATA_DIR"
          npm start -- -p 3100 >/tmp/jarvis-web.log 2>&1 &
          WEB_PID=$!
          cleanup_web() { kill "$WEB_PID" 2>/dev/null || true; }
          trap cleanup_web EXIT
          for i in {1..25}; do
            if curl -fsS http://127.0.0.1:3100/ >/dev/null; then break; fi
            sleep 1
          done
          node - <<'NODE'
          const assert = require('assert');
          const JSZip = require('jszip');
          const fs = require('fs');
          const base = 'http://127.0.0.1:3100';
          async function request(path, body) {
            const r = await fetch(base + path, body === undefined ? {} : {
              method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body)
            });
            const d = await r.json().catch(() => ({}));
            assert.ok(r.ok, `${path} HTTP ${r.status}: ${JSON.stringify(d)}`);
            return d;
          }
          async function validateZipFile(kind, content, requiredEntries) {
            const d = await request('/api/tools/generate-file', { fileType: kind, prompt: `CI ${kind}`, content });
            assert.equal(d.type, 'file_download');
            assert.ok(d.data?.base64?.length > 100, `${kind} output too small`);
            const zip = await JSZip.loadAsync(Buffer.from(d.data.base64, 'base64'));
            for (const entry of requiredEntries) assert.ok(zip.file(entry), `${kind} missing ${entry}`);
          }
          (async () => {
            const home = await fetch(base + '/');
            assert.ok(home.ok, `home HTTP ${home.status}`);
            const html = await home.text();
            assert.match(html, /J\.A\.R\.V\.I\.S\.|JARVIS/i);

            await request('/api/tools/memory', { action: 'clear' });
            const saved = await request('/api/tools/memory', { action: 'save', content: 'CI remembers local persistence' });
            assert.equal(saved.data.content, 'CI remembers local persistence');
            const found = await request('/api/tools/memory', { action: 'search', query: 'local persistence' });
            assert.ok(found.data.some(x => x.content.includes('local persistence')));

            const project = await request('/api/tools/project', { action: 'create', name: 'CI Project', description: 'runtime test' });
            assert.equal(project.data.name, 'CI Project');
            const noted = await request('/api/tools/project', { action: 'note', name: 'CI Project', note: 'project note works' });
            assert.ok(noted.data.notes.some(x => x.content === 'project note works'));
            const projectFetch = await fetch(base + '/api/tools/project?name=' + encodeURIComponent('CI Project'));
            assert.ok(projectFetch.ok);
            const projectData = await projectFetch.json();
            assert.equal(projectData.data.name, 'CI Project');

            const reminder = await request('/api/tools/reminder', { action: 'create', task: 'CI reminder', type: 'relative', seconds: 60 });
            assert.equal(reminder.data.task, 'CI reminder');
            const reminders = await request('/api/tools/reminder', { action: 'list' });
            assert.ok(reminders.data.some(x => x.task === 'CI reminder'));

            await validateZipFile('xlsx', '[["Name","Value"],["Alpha",1],["Beta",2]]', ['xl/workbook.xml','xl/worksheets/sheet1.xml','xl/styles.xml']);
            await validateZipFile('pptx', '# First Slide\n- Point one\n---\n# Second Slide\n- Point two', ['ppt/presentation.xml','ppt/slides/slide1.xml','ppt/slides/slide2.xml']);
            await validateZipFile('docx', '# CI Document\nThis document validates DOCX generation.', ['word/document.xml','[Content_Types].xml']);

            assert.ok(fs.existsSync('/tmp/jarvis-web-store/web-store.json'), 'local persistent store file missing');
            const persisted = JSON.parse(fs.readFileSync('/tmp/jarvis-web-store/web-store.json','utf8'));
            assert.ok(persisted.memories?.some(x => x.content.includes('local persistence')));
            assert.ok(persisted.projects?.some(x => x.name === 'CI Project'));
            assert.ok(persisted.reminders?.some(x => x.task === 'CI reminder'));

            console.log('restored web feature smoke tests passed');
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
          cat /tmp/jarvis-web.log

      - name: Install local core dependencies
        working-directory: companion
        run: npm ci --ignore-scripts

      - name: Companion dependency security gate
        working-directory: companion
        run: npm audit --audit-level=high

      - name: Verify local modules can load
        working-directory: companion
        run: node -e "require('./agents'); require('./policy'); require('playwright-core'); console.log('local modules ok')"

      - name: Boot stack and smoke-test realtime runtime
        working-directory: companion
        shell: bash
        run: |
          node launcher.js >/tmp/jarvis-final.log 2>&1 &
          JARVIS_PID=$!
          cleanup() { kill "$JARVIS_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          sleep 3
          node - <<'NODE'
          const assert = require('assert');
          const base = 'http://127.0.0.1';
          async function json(url, options) {
            const r = await fetch(url, options);
            const d = await r.json();
            assert.ok(r.ok, `${url} HTTP ${r.status}: ${JSON.stringify(d)}`);
            return d;
          }
          async function command(message, scene = { panels: [], selectedId: null }) {
            const started = Date.now();
            const data = await json(`${base}:3007/v1/command`, {
              method: 'POST', headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ message, messages: [], scene }),
            });
            return { data, elapsed: Date.now() - started };
          }
          (async () => {
            const realtime = await json(`${base}:3007/health`);
            assert.equal(realtime.version, '6.1.0');
            const browser1 = await json(`${base}:3006/health`);
            const browser2 = await json(`${base}:3006/health`);
            assert.equal(browser1.state, 'idle'); assert.equal(browser2.state, 'idle');
            assert.equal(browser1.pages, 0); assert.equal(browser2.pages, 0);
            const time = await command('what time is it');
            assert.match(time.data.reply, /It's /); assert.ok(time.elapsed < 1200, `instant time command took ${time.elapsed}ms`);
            const map = await command('pull up a map of Richmond Virginia');
            assert.equal(map.data.hudActions?.[0]?.action, 'show'); assert.equal(map.data.hudActions?.[0]?.panelType, 'map'); assert.equal(map.data.hudActions?.[0]?.query, 'Richmond Virginia');
            const full = await command('make the map take the whole screen');
            assert.equal(full.data.hudActions?.[0]?.action, 'resize'); assert.equal(full.data.hudActions?.[0]?.target, 'map'); assert.equal(full.data.hudActions?.[0]?.position, 'full');
            const weatherMove = await command('move the weather panel to the top right');
            assert.equal(weatherMove.data.hudActions?.[0]?.target, 'weather'); assert.equal(weatherMove.data.hudActions?.[0]?.position, 'top-right');
            const stop = await command('stop talking'); assert.equal(stop.data.clientAction, 'stop-speaking');
            const hello = await command('hey Jarvis'); assert.ok(!/the user|let me think|first i need to/i.test(hello.data.reply || ''));
            const core = await json(`${base}:3003/health`); assert.equal(core.status, 'online');
            console.log('JARVIS final realtime smoke tests passed');
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
          cat /tmp/jarvis-final.log
